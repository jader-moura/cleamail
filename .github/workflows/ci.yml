name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Pinned rather than `ubuntu-latest`. That label began migrating to Ubuntu 26 in October 2026,
    # and a runner image that changes underneath the project turns an unrelated push into a mystery
    # failure. Dependabot moves this forward deliberately instead.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # One source of truth for the Node version, shared with anyone running `nvm use`.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      # Lint, typecheck and test each build their dependencies first, through `dependsOn: ["^build"]`
      # in turbo.json. Type-aware linting resolves workspace imports to each package's `dist`, so on
      # a clean checkout it has nothing to resolve until those are built. This step failed the first
      # time CI ever ran, for exactly that reason.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
